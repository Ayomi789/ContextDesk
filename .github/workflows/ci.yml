name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    env:
      # Dummy values: unit tests throw before any DB query,
      # but PrismaClient requires a well-formed URL at import.
      DATABASE_URL: postgresql://user:password@localhost:5432/neondb
      JWT_SECRET: ci-dummy-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=@contextdesk/shared-types

      - name: Typecheck API
        run: npm run typecheck --workspace=api

      - name: Unit tests
        run: npm test --workspace=api

      - name: Build API
        run: npm run build --workspace=api

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate
